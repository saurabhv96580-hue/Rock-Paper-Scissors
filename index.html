<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors Game</title>
    <link id="fv" rel="shortcut icon" href="C:\saurabh project\rock.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="content">
      <h1>Rock Paper Scissors</h1>
    <div class="choices">
      <div class="choice" id="rock">
        <img src="rock.png" />
      </div>
      <div class="choice" id="paper">
        <img src="paper.png" />
      </div>
      <div class="choice" id="scissors">
        <img src="scessor.png" />
      </div>
    </div>

    <div class="score-board">
      <div class="score">
        <p id="user-score">0</p>
        <p>You</p>
      </div>
      <div class="score">
        <p id="comp-score">0</p>
        <p>Computer</p>
      </div>
    </div>

    <div class="msg-container">
      <p id="msg">Play your move</p>

    </div>
        <button id="ba"> Game reset</button>

    </div>
    <div class="game-over hide">
      <p class="lastpara"></p>
      <button id="but">reset</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
